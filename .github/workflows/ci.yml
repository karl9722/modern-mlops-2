name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv python install 3.11
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen --all-groups ruff check .
      - run: uv run --frozen --all-groups ruff format --check .
      - name: Test with an isolated PostgreSQL database
        shell: bash
        run: |
          set -euo pipefail
          export POSTGRES_PASSWORD="$(uv run --frozen python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          docker run -d --name tp-test-postgres -e POSTGRES_PASSWORD \
            -p 127.0.0.1:55435:5432 postgres:16.13-alpine >/dev/null
          trap 'docker rm -f tp-test-postgres >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if docker exec tp-test-postgres pg_isready -U postgres >/dev/null; then break; fi
            sleep 1
          done
          export TEST_DATABASE_URL="postgresql://postgres:${POSTGRES_PASSWORD}@127.0.0.1:55435/postgres"
          uv run --frozen --all-groups pytest -q

      - name: Audit dependencies for known vulnerabilities
        run: |
          uv export --frozen --all-groups --no-hashes --no-emit-project \
            --format requirements-txt > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip --no-deps

  images:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -f docker/api.Dockerfile -t modern-mlops-2-api:ci .
          docker build -f docker/pipeline.Dockerfile -t modern-mlops-2-pipeline:ci .

      - name: Scan the API image (fails on fixable HIGH/CRITICAL issues)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2 image --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 modern-mlops-2-api:ci

      - name: Scan the pipeline image (report only)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.2 image --timeout 15m --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 0 modern-mlops-2-pipeline:ci
