[project]
name = "modern-mlops"
version = "0.2.0"
description = "Production MLOps pipeline for Ames house price prediction"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.162.0",
    "mlflow>=3.18.0",
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "prometheus-client>=0.24.1",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
    "psycopg[binary,pool]>=3.2,<4",
]

[project.scripts]
mlops-model = "mlops.registry:main"

[dependency-groups]
pipeline = [
    "dagster>=1.13.28",
    "dagster-postgres>=0.29.28",
    "dagster-webserver>=1.13.28",
    "evidently>=0.7.23",
    "feast>=0.67.0",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=26.0.1",
    "pyspark>=3.5,<4",
]
dev = ["pytest>=9.2.0", "ruff>=0.17.3", "httpx>=0.28.1", "locust>=2.20,<3"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mlops"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires the local stack"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["mlops"]
